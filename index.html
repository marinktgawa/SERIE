<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
 <style>
        body {
            font-family: Arial;
            background-color: #fffff;
            color: white
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: #fdb6e5;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 18px;
            margin: 20px 5px 0 0;
            border: none;
            cursor: pointer;
        }

        .salvar {
            background-color: white;
            color: black;
        }

        .limpar {
            background-color: white;
            color: black;
        }

        .editar {
            background-color: white;
        }

        .consultar {
            background-color: white;
            color: black;
        }
    </style>
<body>
     <div class="container">

        <h1>Cadastro de Séries</h1>

        <form>

            <label>Nome da série:</label>
            <input type="text" placeholder="Digite o nome da série">

            <label>Streaming:</label>
            <input type="text" placeholder="Ex: Netflix">

            <label>Autor ou criador:</label>
            <input type="text" placeholder="Digite o nome do autor">

            <label>Quantidade de temporadas:</label>
            <input type="number" placeholder="Ex: 5">

            <label>Ano de criação:</label>
            <input type="number" placeholder="Ex: 2020">

            <label>Personagem 1:</label>
            <input type="text" placeholder="Nome do personagem">

            <label>Personagem 2:</label>
            <input type="text" placeholder="Nome do personagem">

            <label>Personagem 3:</label>
            <input type="text" placeholder="Nome do personagem">

            <button class="salvar">Salvar</button>
            <button class="limpar" type="reset">Limpar</button>
            <button class="editar">Editar</button>
            <button class="consultar">Consultar</button>

        </form>

    </div>

</body>
</html>
